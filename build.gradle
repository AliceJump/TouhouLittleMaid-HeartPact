plugins {
    id "java-library"
    id "idea"
    id "net.neoforged.moddev" version "2.0.95"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForge 配置（参考另一个项目并对齐本仓库的 gradle.properties 变量）
neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file("run/client")
            programArgument "--username"
            programArgument "DevPlayer"
        }
        server {
            server()
            gameDirectory = project.file("run/server")
            programArgument "--nogui"
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.parchmentmc.org" }
    mavenCentral()
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // 使用现有的 neoforge 运行时版本（在 gradle.properties 中定义）
    implementation "maven.modrinth:touhou-little-maid:tuOQjuRE"
    runtimeOnly "maven.modrinth:cloth-config:t8TXrZvZ"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neoforge_version_range  : neoforge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_credits             : mod_credits,
            mod_description         : mod_description,
            mod_description_legacy  : mod_description_legacy
    ]
    inputs.properties replaceProperties
    // 同时匹配多种可能的模组描述文件名
    filesMatching(["META-INF/mods.toml", "META-INF/neoforge.mods.toml", "mcmod.info"]) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

jar {
    archiveFileName = "[车万女仆：心契同眠] ${mod_id}-${mod_version}-neoforge+mc${minecraft_version}.jar"
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}
